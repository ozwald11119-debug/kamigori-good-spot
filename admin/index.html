<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><title>上郡町ガイド 管理</title><link rel="stylesheet" href="admin.css"></head><body><main class="admin"><header><span>KAMIGORI GUIDE</span><h1>投稿管理</h1><p>スポットとおすすめ投稿を管理します。</p></header><section id="login" class="panel"><h2>管理者ログイン</h2><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="メールアドレス" required><input id="password" type="password" autocomplete="current-password" placeholder="パスワード" required><button>ログイン</button><p id="loginMsg" class="msg"></p></form></section><div id="dashboard" class="hidden"><div class="toolbar"><button id="newSpot">＋ スポット追加</button><button id="logout" class="sub">ログアウト</button></div><nav class="tabs"><button data-tab="spots" class="active">スポット</button><button data-tab="recommendations">おすすめ投稿</button></nav><section id="spotsPanel" class="panel"><div id="spotList"></div></section><section id="recommendationsPanel" class="panel hidden"><div id="recommendList"></div></section></div></main><dialog id="spotDialog"><form id="spotForm"><div class="dialogHead"><h2 id="formTitle">スポット追加</h2><button type="button" id="closeDialog">×</button></div><input type="hidden" name="id"><label>店名・スポット名<input name="name" required></label><div class="two"><label>ジャンル<select name="genre"><option>カフェ</option><option>パン</option><option>グルメ</option><option>スイーツ</option><option>ショップ</option><option>スポット</option><option>その他</option></select></label><label>並び順<input name="sort_order" type="number" value="100"></label></div><label>ひとこと<input name="lead"></label><label>説明<textarea name="description"></textarea></label><label>タグ（カンマ区切り）<input name="tags" placeholder="駅近, ランチ, テイクアウト"></label><label>画像URL<input name="image_url" type="url"></label><label>公式サイトURL<input name="website_url" type="url"></label><label>Instagram URL<input name="instagram_url" type="url"></label><label>Google Maps URL<input name="maps_url" type="url"></label><label>紹介投稿URL<input name="post_url" type="url"></label><div class="checks"><label><input name="featured" type="checkbox"> PICK UP</label><label><input name="published" type="checkbox" checked> 公開</label></div><button id="saveSpot" class="primary">保存する</button><button id="deleteSpot" type="button" class="danger hidden">このスポットを削除</button><p id="formMsg" class="msg"></p></form></dialog><script src="admin.js"></script></body></html>
